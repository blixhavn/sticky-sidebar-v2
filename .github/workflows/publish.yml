# Publishes to npm when a GitHub release is published. Authenticates through npm
# trusted publishing (OIDC), so no npm token is stored in the repository. npm ties
# the trusted publisher to this file name; keep it as publish.yml.
name: Publish

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check that the release tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      - name: Check that the committed dist matches the build
        run: git diff --exit-code -- dist

      - run: npm test

      - run: mkdir package && npm pack --pack-destination package

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: package/*.tgz
          if-no-files-found: error

  # Kept separate so the dev dependencies' install scripts never run in a job that
  # can mint an npm publish token.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11

      # GitHub pre-releases go to the "next" dist-tag so they are not installed by default.
      - run: npm publish ./*.tgz --tag "${{ github.event.release.prerelease && 'next' || 'latest' }}"
